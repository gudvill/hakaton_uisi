<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="870" viewBox="0 0 700 870"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, sans-serif" font-size="13">

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#111"/>
    </marker>
  </defs>

  <rect width="700" height="870" fill="#ffffff"/>

  <!-- Дашед-стрелка слева (пользователь → браузер) -->
  <line x1="20" y1="60" x2="70" y2="60"
        stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#arr)"/>
  <line x1="20" y1="60" x2="20" y2="700"
        stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="20" y1="700" x2="70" y2="700"
        stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#arr)"/>

  <!-- ══ СЛОЙ 1 — Маршрутизация ══ -->
  <rect x="70" y="30" width="600" height="60" rx="3"
        fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="55" text-anchor="middle" font-weight="bold" font-size="14">
    Маршрутизация (React Router)
  </text>
  <text x="370" y="75" text-anchor="middle" font-size="11.5" fill="#444">
    index.js → BrowserRouter    |    App.js → Routes / Route    |    AdminRoute (защита /admin)
  </text>

  <line x1="370" y1="90" x2="370" y2="118"
        stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ СЛОЙ 2 — Страницы ══ -->
  <rect x="70" y="118" width="600" height="110" rx="3"
        fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="141" text-anchor="middle" font-weight="bold" font-size="14">
    Страницы (Pages)
  </text>

  <rect x="88" y="150" width="268" height="65" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="222" y="169" text-anchor="middle" font-weight="bold" font-size="12">Публичные</text>
  <text x="222" y="185" text-anchor="middle" font-size="10.5" fill="#333">Home · NewsAllPage · NewsDetailPage</text>
  <text x="222" y="200" text-anchor="middle" font-size="10.5" fill="#333">CaseDetailPage · PhotoGallery</text>
  <text x="222" y="213" text-anchor="middle" font-size="10.5" fill="#555">PrivacyPolicy · UserAgreement · NotFound</text>

  <rect x="372" y="150" width="280" height="65" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="512" y="169" text-anchor="middle" font-weight="bold" font-size="12">Административные</text>
  <text x="512" y="185" text-anchor="middle" font-size="10.5" fill="#333">Admin · Login</text>
  <text x="512" y="200" text-anchor="middle" font-size="10.5" fill="#333">PasswordResetRequestPage</text>
  <text x="512" y="213" text-anchor="middle" font-size="10.5" fill="#555">PasswordResetPage</text>

  <line x1="370" y1="228" x2="370" y2="256"
        stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ СЛОЙ 3 — Компоненты ══ -->
  <rect x="70" y="256" width="600" height="115" rx="3"
        fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="279" text-anchor="middle" font-weight="bold" font-size="14">
    Компоненты (Components)
  </text>

  <rect x="88" y="287" width="268" height="71" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="222" y="305" text-anchor="middle" font-weight="bold" font-size="12">UI-компоненты</text>
  <text x="222" y="321" text-anchor="middle" font-size="10.5" fill="#333">Header · Hero · Time · Cases · About</text>
  <text x="222" y="336" text-anchor="middle" font-size="10.5" fill="#333">Partners · Program · Contacts · News</text>
  <text x="222" y="351" text-anchor="middle" font-size="10.5" fill="#555">Faq · Reviews · Photo · Footer</text>

  <rect x="372" y="287" width="280" height="71" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="512" y="305" text-anchor="middle" font-weight="bold" font-size="12">Секции Admin-панели</text>
  <text x="512" y="321" text-anchor="middle" font-size="10.5" fill="#333">Account · Participants · Stats · Cookie</text>
  <text x="512" y="336" text-anchor="middle" font-size="10.5" fill="#333">News · Cases · Partners · Reviews · Photos</text>
  <text x="512" y="351" text-anchor="middle" font-size="10" fill="#555">Program · Faq · About · Policy · Agreement</text>

  <line x1="370" y1="371" x2="370" y2="399"
        stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ СЛОЙ 4 — Адаптеры ══ -->
  <rect x="70" y="399" width="600" height="145" rx="3"
        fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="422" text-anchor="middle" font-weight="bold" font-size="14">
    Адаптеры (Interface Adapters)
  </text>

  <rect x="88" y="431" width="268" height="100" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="222" y="450" text-anchor="middle" font-weight="bold" font-size="12">API-сервисы (Services)</text>
  <text x="222" y="467" text-anchor="middle" font-size="10.5" fill="#333">newsService · casesService · faqService</text>
  <text x="222" y="483" text-anchor="middle" font-size="10.5" fill="#333">authService · registrationService · aboutService</text>
  <text x="222" y="499" text-anchor="middle" font-size="10.5" fill="#333">reviewsService · partnersService · statsService</text>
  <text x="222" y="515" text-anchor="middle" font-size="10" fill="#555">photoAlbumsService · programService · acquaintanceService</text>

  <rect x="372" y="431" width="280" height="100" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="512" y="450" text-anchor="middle" font-weight="bold" font-size="12">HTTP-клиент (Axios)</text>
  <text x="512" y="467" text-anchor="middle" font-size="10.5" fill="#333">axios.js — единый экземпляр api</text>
  <text x="512" y="483" text-anchor="middle" font-size="10.5" fill="#555">withCredentials: true</text>
  <text x="512" y="499" text-anchor="middle" font-size="10.5" fill="#555">cookies отправляются браузером</text>
  <text x="512" y="515" text-anchor="middle" font-size="10.5" fill="#555">автоматически (без interceptor)</text>

  <line x1="370" y1="544" x2="370" y2="572"
        stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ СЛОЙ 5 — Состояние ══ -->
  <rect x="70" y="572" width="600" height="55" rx="3"
        fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="597" text-anchor="middle" font-weight="bold" font-size="14">
    Состояние (State)
  </text>
  <text x="370" y="617" text-anchor="middle" font-size="11.5" fill="#444">
    React useState / useEffect — локальное состояние каждого компонента
  </text>

  <line x1="370" y1="627" x2="370" y2="657"
        stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#arr)"/>

  <!-- ══ ВНЕШНИЕ КОМПОНЕНТЫ ══ -->
  <rect x="70" y="657" width="600" height="195" rx="3"
        fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="9,4"/>
  <text x="370" y="681" text-anchor="middle" font-weight="bold" font-size="14">
    Внешние компоненты
  </text>

  <!-- Backend REST API -->
  <rect x="88" y="693" width="175" height="80" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="175" y="713" text-anchor="middle" font-weight="bold" font-size="12">Backend REST API</text>
  <text x="175" y="730" text-anchor="middle" font-size="10.5" fill="#444">HTTP-запросы</text>
  <text x="175" y="746" text-anchor="middle" font-size="10.5" fill="#555">withCredentials: true</text>
  <text x="175" y="762" text-anchor="middle" font-size="10.5" fill="#555">REACT_APP_API_URL</text>

  <!-- httpOnly Cookies -->
  <rect x="278" y="693" width="155" height="80" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="355" y="713" text-anchor="middle" font-weight="bold" font-size="12">httpOnly Cookies</text>
  <text x="355" y="730" text-anchor="middle" font-size="10.5" fill="#444">access_token (30 мин)</text>
  <text x="355" y="746" text-anchor="middle" font-size="10.5" fill="#555">refresh_token (7 дней)</text>
  <text x="355" y="762" text-anchor="middle" font-size="10.5" fill="#777">недоступны из JS</text>

  <!-- Яндекс.Метрика -->
  <rect x="448" y="693" width="204" height="80" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="550" y="713" text-anchor="middle" font-weight="bold" font-size="12">Яндекс.Метрика</text>
  <text x="550" y="730" text-anchor="middle" font-size="10.5" fill="#444">Аналитика поведения</text>
  <text x="550" y="746" text-anchor="middle" font-size="10.5" fill="#555">ym() — счётчик</text>
  <text x="550" y="762" text-anchor="middle" font-size="10.5" fill="#555">внешний JS-скрипт</text>

  <!-- Assets -->
  <rect x="88" y="788" width="564" height="50" rx="2"
        fill="#fff" stroke="#111" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="370" y="808" text-anchor="middle" font-weight="bold" font-size="12">Статические ресурсы (Assets)</text>
  <text x="370" y="826" text-anchor="middle" font-size="10.5" fill="#555">
    Шрифты Unbounded · SVG/PNG-фоны · Иконки Heroicons · CSS-стили компонентов
  </text>

</svg>
