version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: hackathon_postgres
    restart: always
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: hackathon_user
      POSTGRES_PASSWORD: hackathon_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: hackathon_backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: hackathon_frontend
    restart: always
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"

  nginx:
    image: nginx:latest
    container_name: hackathon_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data: